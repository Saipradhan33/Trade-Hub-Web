<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegetable Collection — Forma Garden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg: #f4f7f2;
            --text: #1f3d2b;
            --accent: #4caf50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            opacity: 0;
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        body.fade-out {
            opacity: 0;
            transform: scale(1.02); /* zoom effect */
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 800;
            text-decoration: none;
            color: var(--text);
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            border-bottom: 1px solid var(--text);
        }

        .slider-container {
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 10%;
            opacity: 0;
            visibility: hidden;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        .content {
            flex: 1;
            z-index: 2;
        }

        .idx {
            font-size: 5rem;
            font-weight: 800;
            opacity: 0.1;
            margin-bottom: -2rem;
        }

        .tag {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent);
            margin-bottom: 1rem;
            display: block;
        }

        .name {
            font-size: 6rem;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 2rem;
        }

        .desc {
            max-width: 500px;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 3rem;
            opacity: 0.8;
        }

        .stats {
            display: flex;
            gap: 4rem;
            margin-bottom: 3rem;
        }

        .stat-item h4 {
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 5px;
        }

        .stat-item p {
            font-weight: 700;
        }

        .view-details {
            display: inline-block;
            background: var(--text);
            color: #fff;
            padding: 1.2rem 2.5rem;
            text-decoration: none;
            font-weight: 600;
            border-radius: 50px;
            font-size: 0.9rem;
            transition: transform 0.3s;
        }

        .view-details:hover {
            transform: scale(1.05);
        }

        .image-container {
            flex: 1;
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-img {
            width: 80%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.1));
            z-index: 2;
        }

        .circle-bg {
            position: absolute;
            width: 500px;
            height: 500px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.05;
            z-index: 1;
        }

        .nav-buttons {
            position: absolute;
            bottom: 5%;
            right: 10%;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .nav-btn {
            width: 60px;
            height: 60px;
            border: 1px solid var(--text);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: var(--text);
            color: #fff;
        }

        /* Menu Button */
        .menu-btn {
            position: absolute;
            top: 2rem;
            right: 5%;
            background: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 600;
            color: var(--text);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            text-decoration: none;
            display: block;
            border: none;
        }

        /* Menu Overlay */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(244, 247, 242, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        body.menu-open .menu-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            text-align: right;
        }

        .menu-links a {
            font-size: 5rem;
            font-weight: 800;
            color: var(--text);
            text-decoration: none;
            text-transform: uppercase;
            line-height: 1;
            letter-spacing: -2px;
            transition: transform 0.3s, color 0.3s;
        }

        .menu-links a:hover {
            color: var(--accent);
            transform: translateX(-20px);
        }
    </style>
</head>

<body>
    <nav>
        <a href="frontend.html" class="logo">FORMA GARDEN</a>
        <button class="menu-btn" id="menuBtn" onclick="toggleMenu()">+ MENU</button>
    </nav>

    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-links">
            <a href="frontend.html">Home</a>
            <a href="seafood.html">Sea Food</a>
            <a href="vegetables-turmeric.html">Vegetables</a>
            <a href="textile.html">Textiles</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>

    <div class="slider-container">
        <!-- Slides added by JS -->
    </div>

    <div class="nav-buttons">
        <div class="nav-btn" onclick="prev()">←</div>
        <div class="nav-btn" onclick="next()">→</div>
    </div>

    <script>
        const collection = [
            {
                idx: "01",
                tag: "Earth Grown",
                name: "Turmeric",
                desc: "Our Pure Turmeric is harvested from the mineral-rich soils of South Asia, containing 9% Curcumin. It is cold-pressed to preserve its powerful anti-inflammatory properties.",
                type: "Root",
                origin: "Kerala, India",
                curcumin: "9.2%",
                img: "https://images.unsplash.com/photo-1615485290382-441e4d049cb5?q=80&w=1000&auto=format&fit=crop"
            },
            {
                idx: "02",
                tag: "Garden Fresh",
                name: "Broccoli",
                desc: "Hydroponically grown and harvested at the break of dawn. Our broccoli offers a crunch and nutrient density that is unmatched in commercial farming.",
                type: "Cruciferous",
                origin: "Local Hydro-Farm",
                vitamin: "High C & K",
                img: "https://images.unsplash.com/photo-1459411621453-7b03977f4bfc?q=80&w=1000&auto=format&fit=crop"
            },
            {
                idx: "03",
                tag: "Organic",
                name: "Bell Pepper",
                desc: "Vibrant, thick-walled bell peppers grown without any chemical pesticides. Perfect for grilling or fresh salads, carrying the natural sweetness of sun-ripened fruit.",
                type: "Vegetable",
                origin: "Organic Valley",
                sweetness: "Premium Grade",
                img: "https://images.unsplash.com/photo-1566385101042-1a000c1267c4?q=80&w=1000&auto=format&fit=crop"
            }
        ];

        const container = document.querySelector('.slider-container');
        let currentIdx = 0;

        function createSlides() {
            collection.forEach((item, i) => {
                const slide = document.createElement('div');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                slide.innerHTML = `
                    <div class="content">
                        <div class="idx">${item.idx}</div>
                        <span class="tag">${item.tag}</span>
                        <h2 class="name">${item.name}</h2>
                        <p class="desc">${item.desc}</p>
                        <div class="stats">
                            <div class="stat-item">
                                <h4>Type</h4>
                                <p>${item.type}</p>
                            </div>
                            <div class="stat-item">
                                <h4>Origin</h4>
                                <p>${item.origin}</p>
                            </div>
                            <div class="stat-item">
                                <h4>Attribute</h4>
                                <p>${Object.values(item)[8] || Object.values(item)[9]}</p>
                            </div>
                        </div>
                        <a href="vegetables-details.html" class="view-details">View Details</a>
                    </div>
                    <div class="image-container">
                        <div class="circle-bg"></div>
                        <img src="${item.img}" class="main-img" alt="${item.name}">
                    </div>
                `;
                container.appendChild(slide);
            });
        }

        function next() {
            const slides = document.querySelectorAll('.slide');
            gsap.to(slides[currentIdx], { opacity: 0, x: -50, duration: 0.5, onComplete: () => {
                slides[currentIdx].classList.remove('active');
                currentIdx = (currentIdx + 1) % collection.length;
                slides[currentIdx].classList.add('active');
                gsap.fromTo(slides[currentIdx], { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.5 });
            }});
        }

        function prev() {
            const slides = document.querySelectorAll('.slide');
            gsap.to(slides[currentIdx], { opacity: 0, x: 50, duration: 0.5, onComplete: () => {
                slides[currentIdx].classList.remove('active');
                currentIdx = (currentIdx - 1 + collection.length) % collection.length;
                slides[currentIdx].classList.add('active');
                gsap.fromTo(slides[currentIdx], { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.5 });
            }});
        }

        createSlides();
        
        window.addEventListener("load", () => {
            document.body.classList.add('loaded');
            // Immediate intro animation for first slide
            const firstSlide = document.querySelector('.slide.active');
            gsap.fromTo(firstSlide.querySelectorAll('.idx, .tag, .name, .desc, .stat-item, .view-details, .image-container'), 
                { opacity: 0, y: 30 }, 
                { opacity: 1, y: 0, duration: 0.8, stagger: 0.1, ease: "power3.out" }
            );
        });

        // Premium Page Transition
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', (e) => {
                const href = link.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('javascript')) {
                    e.preventDefault();
                    document.body.classList.add('fade-out');
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                }
            });
        });

        function toggleMenu() {
            const body = document.body;
            const btn = document.getElementById('menuBtn');
            const isOpen = body.classList.toggle('menu-open');
            btn.innerText = isOpen ? '× CLOSE' : '+ MENU';
        }

        document.getElementById('menuOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'menuOverlay') toggleMenu();
        });
    </script>
</body>

</html>
